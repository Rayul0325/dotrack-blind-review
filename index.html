<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="쇼츠에 별점을 주고 제작 모델을 예상한 뒤, 내 순위와 정답을 확인하는 블라인드 테스트입니다.">
  <meta name="theme-color" content="#edf1f7">
  <meta property="og:title" content="DOTRACK 쇼츠 블라인드 테스트">
  <meta property="og:description" content="쇼츠를 한 편씩 평가하고 정답을 공개하세요.">
  <title>DOTRACK 쇼츠 블라인드 테스트</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182540;
      --muted: #4e5c75;
      --surface: #fff;
      --ground: #edf1f7;
      --line: #d2dae7;
      --accent: #254ac8;
      --well: #141d2c;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      color: var(--ink);
      background: var(--ground);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    [hidden] { display: none !important; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, video:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    main { width: min(940px, calc(100% - 48px)); margin: 52px auto; }
    header { margin-bottom: 26px; }
    .identifier, .clip, .progress {
      font: 700 .84rem/1.3 ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
    .identifier { margin: 0 0 8px; letter-spacing: .13em; color: var(--accent); }
    h1 { margin: 0; font-size: clamp(1.8rem, 4.5vw, 3.1rem); letter-spacing: -.055em; line-height: 1.14; }
    .intro { color: var(--muted); margin: 10px 0 0; line-height: 1.55; }
    .preview { display: inline-block; margin: 12px 0 0; padding: 5px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--muted); font-size: .84rem; }
    .layout { display: grid; grid-template-columns: minmax(300px, 1.25fr) minmax(275px, 1fr); gap: 24px; align-items: start; }
    .layout.ranking-mode { grid-template-columns: minmax(0, 1fr); }
    .screen { background: var(--well); border-radius: 16px; padding: 14px 16px 16px; }
    .screen-title { margin: 0 0 10px; color: #f2f5fb; display: flex; align-items: center; gap: 9px; font-weight: 700; }
    .screen-title .clip { border: 1px solid #63708a; padding: 2px 7px; border-radius: 4px; min-width: 27px; text-align: center; }
    video { display: block; aspect-ratio: 9 / 16; height: min(64svh, 580px); max-width: 100%; margin: auto; border-radius: 5px; background: #070b12; object-fit: contain; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 21px; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    h2 { margin: 0; font-size: 1.1rem; letter-spacing: -.025em; }
    .progress { color: var(--muted); margin: 0; text-align: right; }
    form, .finished, .ranking { margin-top: 21px; }
    fieldset { padding: 0; border: 0; margin: 0; min-width: 0; }
    legend, .field-label { font-weight: 750; }
    .scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; margin-top: 9px; }
    .score-option { position: relative; }
    .score-option input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .score-option label {
      display: grid; place-items: center; min-height: 44px; background: var(--ground);
      border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
    }
    .score-option input:checked + label { border-color: var(--accent); background: var(--accent); color: #fff; }
    .score-option input:focus-visible + label, input[type="text"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .hint { color: var(--muted); font-size: .83rem; font-weight: 500; }
    .note-field { display: grid; gap: 8px; margin-top: 19px; }
    input[type="text"], textarea, select {
      width: 100%; min-height: 44px; font: inherit; padding: 9px 11px;
      color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
    }
    .score-option label { color: #76520e; font-size: 1.02rem; }
    .rank-list { list-style: none; padding: 0; margin: 14px 0 0; }
    .rank-row { display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr); gap: 22px; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--line); }
    .rank-video { width: 100%; height: auto; }
    .rank-controls { display: grid; gap: 12px; align-content: start; }
    .rank-controls select { min-width: 0; max-width: 150px; padding: 6px; }
    .rank-controls label { display: grid; gap: 6px; }
    .rank-number { color: var(--muted); min-width: 2.2em; }
    .rank-label small { display: block; color: #76520e; }
    textarea { min-height: 130px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .action { border: 1px solid var(--accent); border-radius: 7px; min-height: 44px; padding: 8px 13px; font-weight: 750; }
    .primary { background: var(--accent); color: #fff; }
    .secondary { background: var(--surface); color: var(--accent); }
    .action:disabled { opacity: .48; cursor: default; }
    .note-text { display: block; color: var(--muted); font-size: .84rem; margin-top: 3px; overflow-wrap: anywhere; }
    .answers { margin-top: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: .91rem; text-align: left; }
    th, td { padding: 9px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); }
    td:first-child { font-weight: 700; }
    .error { color: #922323; background: var(--surface); padding: 10px; border-radius: 7px; }
    @media (max-width: 700px) {
      main { width: min(475px, calc(100% - 28px)); margin: 25px auto 32px; }
      header { margin-bottom: 17px; }
      .layout { grid-template-columns: minmax(0, 1fr); gap: 15px; }
      .screen { padding: 12px; }
      .panel { padding: 16px; }
      video { height: min(60svh, 490px); }
      .rank-row { grid-template-columns: minmax(0, 58%) minmax(0, 1fr); gap: 10px; }
      .rank-video { height: auto; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="identifier">DOTRACK</p>
      <h1>쇼츠 블라인드 테스트</h1>
      <p class="intro">쇼츠를 한 편씩 보고 별점을 남겨 주세요. 전체 순위를 확정한 뒤 평가 파일을 진행자에게 보내 주세요.</p>
      <p class="preview" id="preview" hidden></p>
    </header>
    <div class="layout" id="review-layout">
      <section class="screen" id="main-screen" aria-labelledby="screen-title">
        <p class="screen-title" id="screen-title"><span>영상</span><span class="clip" id="current">A</span></p>
        <video id="player" aria-label="영상 A" controls playsinline preload="metadata"></video>
        <p class="error" id="playback-error" role="status" hidden>영상을 불러오지 못했습니다. 페이지를 새로고침해 주세요.</p>
      </section>
      <section class="panel" aria-labelledby="panel-title">
        <div class="panel-head">
          <h2 id="panel-title">영상 평가</h2>
          <p class="progress" id="progress" aria-live="polite"></p>
        </div>
        <form id="review">
          <fieldset>
            <legend>별점 <span class="hint">5점 만점 · 필수</span></legend>
            <div class="scale" id="scale"></div>
          </fieldset>
          <label class="note-field">
            <span class="field-label">예상 모델</span>
            <select id="guess"><option value="">모르겠어요</option></select>
          </label>
          <label class="note-field">
            <span class="field-label">예상 하네스</span>
            <select id="harness"><option value="">모르겠어요</option></select>
          </label>
          <label class="note-field">
            <span class="field-label">한 줄 코멘트 <span class="hint">선택</span></span>
            <input type="text" id="note" maxlength="150" autocomplete="off">
          </label>
          <div class="actions">
            <button class="action secondary" id="previous" type="button">이전 평가</button>
            <button class="action primary" id="next" type="submit">저장하고 다음</button>
          </div>
        </form>
        <div class="ranking" id="ranking" hidden>
          <p class="intro">별점순으로 정렬했어요. 각 행에서 영상을 재생하고 순위를 바꿀 수 있습니다.</p>
          <ol class="rank-list" id="rank-list"></ol>
          <div class="actions">
            <button class="action secondary" id="back-review" type="button">평가 수정</button>
            <button class="action primary" id="confirm-rank" type="button">순위 확정</button>
          </div>
        </div>
        <div class="finished" id="finished" hidden>
          <div id="send-block" hidden>
            <label class="note-field" id="nickname-field">
              <span class="field-label">별명</span>
              <input type="text" id="nickname" maxlength="32" autocomplete="nickname">
            </label>
            <p class="intro" id="privacy-note">제출하면 별명과 평가를 진행자에게 저장합니다. 제출 후에는 내 평가와 각 영상의 정답을 볼 수 있습니다.</p>
            <div class="actions"><button class="action primary" id="send-review" type="button">평가 제출</button></div>
            <p class="hint" id="send-status" role="status"></p>
          </div>
          <p class="intro" id="offline-note">다운로드한 JSON 파일을 Discord에서 진행자에게 보내 주세요.</p>
          <div class="actions">
            <button class="action secondary" id="download" type="button">평가 JSON 다운로드</button>
            <button class="action secondary" id="copy" type="button">평가 복사</button>
            <button class="action secondary" id="edit" type="button">순위 수정</button>
          </div>
          <p class="hint" id="copy-status" role="status"></p>
          <textarea id="copy-fallback" aria-label="복사할 평가" readonly hidden></textarea>
          <section class="answers" id="answers" aria-label="내 평가 결과" hidden></section>
        </div>
      </section>
    </div>
  </main>
  <noscript>영상 평가와 정답 공개를 사용하려면 JavaScript를 켜 주세요.</noscript>
  <script id="data" type="application/json">{"entries": [{"letter": "A"}, {"letter": "B"}, {"letter": "C"}, {"letter": "D"}, {"letter": "E"}, {"letter": "F"}, {"letter": "G"}, {"letter": "H"}, {"letter": "I"}, {"letter": "J"}, {"letter": "K"}, {"letter": "L"}, {"letter": "M"}, {"letter": "N"}, {"letter": "O"}, {"letter": "P"}], "total": 16, "preview": false, "review_id": "c1c6cc34d171929d", "models": ["Claude Fable 5.2", "Claude Haiku 5.5", "Claude Opus 5.5", "Claude Sonnet 5.5", "GPT-6 Luna", "GPT-6.1 Terra", "GPT-6.2 Astra", "GPT-6.2 Sol", "Gemini 4 Carbon", "Gemini 4 Hydrogen", "Gemini 4 Neon", "Grok 4.7"]}</script>
  <script>
    const byId = id => document.getElementById(id);
    const { entries, total, preview, review_id, models } = JSON.parse(byId("data").textContent);
    const player = byId("player");
    const rankRows = new Map();
    const form = byId("review");
    const note = byId("note");
    const guess = byId("guess");
    const harness = byId("harness");
    const harnesses = ["Cursor", "Codex", "Dryforge"];
    const hosted = !preview && location.protocol !== "file:";
    const answerEndpoint = "https://macstudio.tail3fadc3.ts.net:10000/dotrack-ecb6e1598693/answers";
    const key = `dotrack-rank-review:${review_id}`;
    const indices = entries.map((_, index) => index);
    for (const model of models) guess.add(new Option(model, model));
    for (const name of harnesses) harness.add(new Option(name, name));
    let stored;
    try { stored = JSON.parse(localStorage.getItem(key)); } catch {}
    const reviews = entries.map((_, index) => {
      const value = stored?.reviews?.[index];
      const score = Number.isInteger(value?.score) && value.score >= 1 && value.score <= 5 ? value.score : null;
      return {
        score,
        guess: models.includes(value?.guess) ? value.guess : "",
        harness: harnesses.includes(value?.harness) ? value.harness : "",
        note: typeof value?.note === "string" ? value.note.slice(0, 150) : "",
      };
    });
    let selected = Number.isInteger(stored?.selected) && entries[stored.selected] ? stored.selected : 0;
    let order = Array.isArray(stored?.order) && stored.order.length === indices.length && indices.every(i => stored.order.includes(i)) ? stored.order : null;
    let phase = order && reviews.every(review => review.score) && ["ranking", "complete"].includes(stored?.phase) ? stored.phase : "review";
    const submissionId = typeof stored?.submission_id === "string" && /^[\da-f]{24}$/.test(stored.submission_id)
      ? stored.submission_id
      : Array.from(crypto.getRandomValues(new Uint8Array(12)), byte => byte.toString(16).padStart(2, "0")).join("");
    const submissionKey = typeof stored?.submission_key === "string" && /^[\da-f]{48}$/.test(stored.submission_key)
      ? stored.submission_key
      : Array.from(crypto.getRandomValues(new Uint8Array(24)), byte => byte.toString(16).padStart(2, "0")).join("");
    let completedAt = typeof stored?.completed_at === "string" ? stored.completed_at : null;
    let accepted = hosted && phase === "complete" && Boolean(stored?.accepted);
    const nickname = byId("nickname");
    nickname.value = typeof stored?.nickname === "string" ? stored.nickname : "";

    if (preview) {
      byId("preview").textContent = `미리보기 · ${entries.length}/${total}편`;
      byId("preview").hidden = false;
    }

    for (let score = 1; score <= 5; score++) {
      const option = document.createElement("div");
      option.className = "score-option";
      const input = document.createElement("input");
      input.type = "radio";
      input.name = "score";
      input.id = `score-${score}`;
      input.value = score;
      input.required = true;
      const label = document.createElement("label");
      label.className = "clip";
      label.htmlFor = input.id;
      label.textContent = `★ ${score}`;
      option.append(input, label);
      byId("scale").append(option);
    }

    function persist() {
      try {
        localStorage.setItem(key, JSON.stringify({
          reviews, selected, phase, order, submission_id: submissionId, completed_at: completedAt,
          submission_key: submissionKey, nickname: nickname.value, accepted,
        }));
      } catch {}
    }

    function updateProgress() {
      byId("progress").textContent = `평가 ${reviews.filter(review => review.score).length}/${entries.length}`;
    }

    function renderStep() {
      const { letter } = entries[selected];
      const ranking = phase === "ranking";
      byId("review-layout").classList.toggle("ranking-mode", ranking);
      byId("main-screen").hidden = ranking;
      if (ranking) player.pause();
      else for (const row of rankRows.values()) row.clip.pause();
      byId("panel-title").textContent = { review: `영상 ${letter} 평가`, ranking: "전체 순위", complete: "평가 완료" }[phase];
      form.hidden = phase !== "review";
      byId("ranking").hidden = phase !== "ranking";
      byId("finished").hidden = phase !== "complete";
      byId("send-block").hidden = !hosted;
      byId("offline-note").hidden = hosted;
      byId("nickname-field").hidden = accepted;
      byId("privacy-note").hidden = accepted;
      byId("edit").hidden = accepted;
      byId("send-review").textContent = accepted ? "내 평가 보기" : "평가 제출";
      byId("current").textContent = letter;
      player.setAttribute("aria-label", `영상 ${letter}`);
      const src = `video/${letter}.mp4`;
      if (!ranking && player.getAttribute("src") !== src) {
        byId("playback-error").hidden = true;
        player.src = src;
      }
      for (const option of form.elements.score) {
        option.checked = Number(option.value) === reviews[selected].score;
      }
      note.value = reviews[selected].note;
      guess.value = reviews[selected].guess;
      harness.value = reviews[selected].harness;
      byId("previous").disabled = selected === 0;
      byId("next").textContent = selected === entries.length - 1 ? "순위 매기기" : "저장하고 다음";
      if (phase === "ranking") renderRanking();
      updateProgress();
      persist();
    }

    function recordInput() {
      reviews[selected] = {
        score: Number(form.elements.score.value) || null,
        guess: guess.value, harness: harness.value, note: note.value.trim(),
      };
      persist();
      updateProgress();
    }

    player.addEventListener("error", () => { byId("playback-error").hidden = false; });
    form.addEventListener("input", recordInput);
    byId("previous").addEventListener("click", () => {
      selected -= 1;
      renderStep();
    });
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      recordInput();
      if (selected < entries.length - 1) {
        selected += 1;
      } else {
        const missing = reviews.findIndex(review => !review.score);
        if (missing === -1) {
          order ??= [...indices].sort((a, b) => reviews[b].score - reviews[a].score);
          phase = "ranking";
        } else {
          selected = missing;
        }
      }
      renderStep();
      if (matchMedia("(max-width: 700px)").matches) (phase === "ranking" ? byId("panel-title") : byId("screen-title")).scrollIntoView({ block: "start" });
    });

    function renderRanking() {
      const list = byId("rank-list");
      order.forEach((index, rank) => {
        if (!rankRows.has(index)) rankRows.set(index, createRankRow(index));
        const item = rankRows.get(index);
        item.number.textContent = `${rank + 1}위`;
        item.stars.textContent = `★ ${reviews[index].score}/5`;
        item.position.value = String(rank);
        const before = list.children[rank] || null;
        if (before !== item.row) {
          if (item.row.parentNode === list && typeof list.moveBefore === "function") list.moveBefore(item.row, before);
          else list.insertBefore(item.row, before);
        }
      });
    }

    function createRankRow(index) {
      const { letter } = entries[index];
      const row = document.createElement("li");
      row.className = "rank-row";
      const clip = document.createElement("video");
      clip.className = "rank-video";
      clip.controls = true;
      clip.playsInline = true;
      clip.preload = "none";
      clip.poster = `poster/${letter}.jpg`;
      clip.src = `video/${letter}.mp4`;
      clip.setAttribute("aria-label", `영상 ${letter} 재생`);
      clip.addEventListener("play", () => {
        player.pause();
        for (const other of rankRows.values()) if (other.clip !== clip) other.clip.pause();
      });
      const controls = document.createElement("div");
      controls.className = "rank-controls";
      const number = document.createElement("span");
      number.className = "clip rank-number";
      const label = document.createElement("div");
      label.className = "rank-label";
      label.textContent = `영상 ${letter}`;
      const stars = document.createElement("small");
      label.append(stars);
      const field = document.createElement("label");
      field.textContent = "순위 변경";
      const position = document.createElement("select");
      position.setAttribute("aria-label", `영상 ${letter} 순위`);
      indices.forEach(i => position.add(new Option(`${i + 1}위`, i)));
      position.addEventListener("change", () => {
        order.splice(order.indexOf(index), 1);
        order.splice(Number(position.value), 0, index);
        renderRanking();
        position.focus({ preventScroll: true });
        persist();
      });
      field.append(position);
      controls.append(number, label, field);
      row.append(clip, controls);
      return { row, clip, number, stars, position };
    }

    byId("confirm-rank").addEventListener("click", () => {
      phase = "complete";
      completedAt = new Date().toISOString();
      renderStep();
      (hosted ? nickname : byId("download")).focus();
    });
    byId("back-review").addEventListener("click", () => {
      phase = "review";
      renderStep();
    });

    function submission() {
      return {
        schema_version: 1,
        review_id,
        submission_id: submissionId,
        completed_at: completedAt,
        nickname: nickname.value.trim() || null,
        ratings: order.map((index, rank) => ({
          video: entries[index].letter,
          rank: rank + 1,
          stars: reviews[index].score,
          guess: reviews[index].guess || null,
          guess_harness: reviews[index].harness || null,
          comment: reviews[index].note || null,
        })),
      };
    }

    byId("download").addEventListener("click", () => {
      if (phase !== "complete") return;
      const file = new Blob([JSON.stringify(submission(), null, 2) + "\n"], { type: "application/json" });
      const url = URL.createObjectURL(file);
      const link = document.createElement("a");
      link.href = url;
      link.download = `DOTRACK-평가-${submissionId}.json`;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    nickname.addEventListener("input", persist);
    byId("send-review").addEventListener("click", async () => {
      if (phase !== "complete" || !hosted) return;
      const status = byId("send-status");
      const button = byId("send-review");
      if (!nickname.value.trim()) {
        status.textContent = "별명을 입력해 주세요.";
        nickname.focus();
        return;
      }
      const alreadyAccepted = accepted;
      status.textContent = alreadyAccepted ? "내 평가를 불러오는 중…" : "평가를 저장하는 중…";
      button.disabled = true;
      byId("edit").disabled = true;
      try {
        const response = await fetch(answerEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "submit", ...submission(), submission_key: submissionKey }),
        });
        if (!response.ok) throw new Error("Submission failed");
        const result = await response.json();
        const own = result.own_review;
        const answerByLetter = new Map(result.entries.map(entry => [entry.letter, entry]));
        const indexByLetter = new Map(entries.map(({ letter }, index) => [letter, index]));
        order = own.ratings.map(entry => {
          const index = indexByLetter.get(entry.video);
          reviews[index] = { score: entry.stars, guess: entry.guess || "", harness: entry.guess_harness || "", note: entry.comment || "" };
          return index;
        });
        nickname.value = own.nickname;
        accepted = true;
        renderStep();
        renderPersonalReview(answerByLetter);
        status.textContent = alreadyAccepted ? "내 평가를 불러왔습니다." : "평가가 저장됐습니다.";
      } catch {
        status.textContent = "평가 서버에 연결하지 못했습니다. 다시 시도하거나 JSON을 내려받아 주세요.";
      } finally {
        button.disabled = false;
        byId("edit").disabled = false;
      }
    });

    function renderPersonalReview(answerByLetter) {
      const area = byId("answers");
      const title = document.createElement("h2");
      title.textContent = "내 평가와 정답";
      const table = document.createElement("table");
      const head = table.createTHead().insertRow();
      for (const name of ["순위", "별점", "정답 · 내 평가"]) {
        const cell = document.createElement("th");
        cell.scope = "col";
        cell.textContent = name;
        head.append(cell);
      }
      const body = table.createTBody();
      order.forEach((index, rank) => {
        const { letter } = entries[index];
        const { app, model } = answerByLetter.get(letter);
        const row = body.insertRow();
        const review = reviews[index];
        row.insertCell().textContent = `${rank + 1}위 ${letter}`;
        row.insertCell().textContent = `${review.score}/5`;
        const item = row.insertCell();
        item.textContent = `${app} · ${model}`;
        const prediction = document.createElement("span");
        prediction.className = "note-text";
        const predictions = [
          review.guess && `예상 모델 ${review.guess} · ${review.guess === model ? "적중" : "다름"}`,
          review.harness && `예상 하네스 ${review.harness} · ${review.harness === app ? "적중" : "다름"}`,
        ].filter(Boolean);
        prediction.textContent = predictions.join(" / ") || "예상 건너뜀";
        item.append(prediction);
        if (review.note) {
          const text = document.createElement("span");
          text.className = "note-text";
          text.textContent = review.note;
          item.append(text);
        }
      });
      area.replaceChildren(title, table);
      area.hidden = false;
    }

    byId("copy").addEventListener("click", async () => {
      const lines = order.map((index, rank) => {
        const { letter } = entries[index];
        const review = reviews[index];
        const prediction = [review.harness, review.guess].filter(Boolean).join(" / ");
        return `${rank + 1}위 ${letter} · ★ ${review.score}/5${prediction ? ` · 예상 ${prediction}` : ""}${review.note ? ` · ${review.note}` : ""}`;
      });
      const text = ["DOTRACK 블라인드 평가", ...lines].join("\n");
      const field = byId("copy-fallback");
      try {
        await navigator.clipboard.writeText(text);
        field.hidden = true;
        byId("copy-status").textContent = "평가를 복사했습니다.";
      } catch {
        field.value = text;
        field.hidden = false;
        field.select();
        byId("copy-status").textContent = "선택된 평가를 복사해 주세요.";
      }
    });

    byId("edit").addEventListener("click", () => {
      if (accepted) return;
      phase = "ranking";
      byId("copy-status").textContent = "";
      byId("copy-fallback").hidden = true;
      renderStep();
    });
    renderStep();
  </script>
</body>
</html>
